name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so toolchain rot surfaces before it blocks a release.
    - cron: '0 6 * * 1'

jobs:
  test:
    name: ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Currently maintained Ruby branches only. 3.2 reached EOL 2026-03-31.
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # No build step: there is no native extension any more.
      - name: Assert no native extension is loaded
        run: |
          ruby -Ilib -e 'require "hpricot"
            native = $LOADED_FEATURES.grep(/hpricot_scan|fast_xs/)
            abort("native extension loaded: #{native}") unless native.empty?
            puts "pure Ruby confirmed"'

      # test_differential is excluded: it needs a separately built checkout of
      # the old C scanner as an oracle, which only exists locally. See the
      # differential job below.
      - name: Test
        run: |
          ruby -Ilib -Itest -e 'Dir["test/test_*.rb"]
            .reject { |f| f.include?("differential") }
            .each { |f| require File.expand_path(f) }'

  # The C scanner produced different trees for the same bytes from one process
  # to the next. This job asserts the replacement does not, which is the whole
  # point of the port. It gates: if it fails, a nondeterminism has returned.
  determinism:
    name: determinism (20 runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Assert 20 identical runs
        run: |
          for i in $(seq 1 20); do
            ruby -Ilib -Itest test/test_parser.rb 2>&1 \
              | grep -oE '[0-9]+ failures, [0-9]+ errors' || echo 'crashed'
          done | sort | uniq -c | tee results.txt
          if [ "$(wc -l < results.txt)" -ne 1 ]; then
            echo "::error::Nondeterministic: $(wc -l < results.txt) distinct outcomes across 20 runs."
            exit 1
          fi
          grep -q '0 failures, 0 errors' results.txt || {
            echo "::error::Deterministic but not passing."; exit 1; }
          echo "::notice::20 identical passing runs."

  # Byte-identical round-tripping is the guarantee this library exists to
  # provide, so it is asserted directly rather than only via the unit tests.
  fidelity:
    name: byte-identical round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Round-trip every fixture
        run: |
          ruby -Ilib -e 'require "hpricot"
            files = Dir["test/files/*"].select { |f| File.file?(f) }
            abort("no fixtures found") if files.empty?
            bad = files.reject { |f|
              src = File.binread(f)
              Hpricot::XML(src).to_original_html == src
            }
            abort("not byte-identical: #{bad.inspect}") unless bad.empty?
            puts "#{files.size} fixtures round-trip byte-identically"'

  # JRuby now runs the same code as everything else: the separate Java scanner
  # the fork used to carry is gone. Allowed to fail until proven green.
  jruby:
    name: jruby (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby
          bundler-cache: true
      - run: |
          ruby -Ilib -Itest -e 'Dir["test/test_*.rb"]
            .reject { |f| f.include?("differential") }
            .each { |f| require File.expand_path(f) }'

  # Ruby trunk. Allowed to fail: it breaks for reasons upstream of this repo.
  # Note this is also the job that caught the C extension failing to compile on
  # trunk, which was part of the motivation for removing it.
  ruby-head:
    name: ruby-head (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true
      - run: |
          ruby -Ilib -Itest -e 'Dir["test/test_*.rb"]
            .reject { |f| f.include?("differential") }
            .each { |f| require File.expand_path(f) }'
